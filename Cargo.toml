[workspace]
resolver = "3"
members = [
    "crates/git-core",
    "crates/git-ops",
    "crates/graph-layout",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
base64 = "0.23"
bstr = "1"
directories = "6"
encoding_rs = "0.8"
env_logger = "0.11"
futures = "0.3"
gix = { version = "0.90", default-features = false, features = [
    "revision",
    "blob-diff",
    "status",
    "dirwalk",
    "index",
    "parallel",
    "mailmap",
    "sha1",
] }
jiff = "1"
log = "0.4"
notify = "8"
regex = "1"
rfd = { version = "0.18", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
tempfile = "3"
thiserror = "2"
which = "8"

# GPUI + Ely-GPUI-Components (latest from upstream main)
ely-core = { git = "https://github.com/ELY-Open-Source/Ely-GPUI-Components", features = ["platform", "fonts", "runtime_shaders"] }
ely-git = { git = "https://github.com/ELY-Open-Source/Ely-GPUI-Components" }
gpui = { package = "gpui-pre", version = "0.3", default-features = false, features = ["stacker"] }
gpui_platform = { package = "gpui-pre-platform", version = "0.3", features = ["font-kit"] }

# Local workspace crates
git-graph-core = { path = "crates/git-core" }
git-graph-ops = { path = "crates/git-ops" }
git-graph-layout = { path = "crates/graph-layout" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
